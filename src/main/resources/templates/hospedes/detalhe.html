<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body data-area="admin">
<a th:replace="~{layout/fragments :: pular-para-conteudo}"></a>
<div class="app-wrapper">

    <aside th:replace="~{layout/fragments :: sidebar('hospedes')}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/fragments :: topbar}"></header>

        <main class="app-content" id="app-conteudo" tabindex="-1">
            <th:block th:fragment="conteudo">
            <div th:replace="~{layout/fragments :: mensagens}"></div>

            <div class="page-header">
    <div>
        <div class="page-context">Cadastros</div>
        <h1 th:text="${titulo}">Detalhes do hóspede</h1>
    </div>
    <div class="page-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/hospedes}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Voltar
        </a>
    </div>
</div>

            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-4">
                                <i class="bi bi-person-circle display-5 text-secondary" aria-hidden="true"></i>
                                <div>
                                    <h2 class="h4 mb-0" th:text="${hospede.nome}">Ana Souza</h2>
                                    <span class="text-secondary small">
                                        Cadastrado em <span th:text="${hospede.dataCadastro} ?: '—'">19/10/2026</span>
                                    </span>
                                </div>
                            </div>

                            <dl class="row mb-0">
                                <dt class="col-sm-4">CPF</dt>
                                <dd class="col-sm-8" th:text="${hospede.cpfCompleto} ?: 'Não informado'">529.982.247-25</dd>

                                <dt class="col-sm-4">Data de nascimento</dt>
                                <dd class="col-sm-8" th:text="${hospede.dataNascimento} ?: 'Não informada'">14/03/1990</dd>

                                <dt class="col-sm-4">Telefone</dt>
                                <dd class="col-sm-8" th:text="${hospede.telefone} ?: 'Não informado'">(11) 98888-0001</dd>

                                <dt class="col-sm-4">E-mail</dt>
                                <dd class="col-sm-8" th:text="${hospede.email} ?: 'Não informado'">ana@exemplo.com</dd>

                                <dt class="col-sm-4">Observações</dt>
                                <dd class="col-sm-8" th:text="${hospede.observacoes} ?: '—'">—</dd>
                            </dl>
                        </div>
                        <div class="card-footer bg-transparent d-flex gap-2">
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{'/hospedes/' + ${hospede.id} + '/editar'}">
                                 <i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar
                             </a>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/hospedes}">
                                <i class="bi bi-list me-1" aria-hidden="true"></i>Voltar à listagem
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
        </main>
    </div>

</div>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
