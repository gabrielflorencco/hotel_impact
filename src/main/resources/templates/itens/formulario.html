<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body data-area="admin">
<a th:replace="~{layout/fragments :: pular-para-conteudo}"></a>
<div class="app-wrapper">

    <aside th:replace="~{layout/fragments :: sidebar('consumos')}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/fragments :: topbar}"></header>

        <main class="app-content" id="app-conteudo" tabindex="-1">
            <th:block th:fragment="conteudo">
            <div th:replace="~{layout/fragments :: mensagens}"></div>

            <div class="page-header">
    <div>
        <div class="page-context">Quartos & insumos</div>
        <h1 th:text="${titulo}">Novo item</h1>
    </div>
    <div class="page-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/itens}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Voltar
        </a>
    </div>
</div>

            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="alert alert-info py-2 small mb-3">
                                <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
                                Serviços nunca controlam estoque — a flag é ignorada para eles.
                                Itens com consumos registrados não podem ser excluídos; desative-os.
                            </div>

                            <form th:action="${form.id == null} ? @{/itens} : @{'/itens/' + ${form.id}}"
                                  th:object="${form}" method="post" novalidate>
    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label for="nome" class="form-label campo-obrigatorio">Nome</label>
                                        <input type="text" class="form-control" id="nome" th:field="*{nome}"
                                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                               maxlength="80" placeholder="Ex.: Água mineral 500ml">
                                        <div class="invalid-feedback" th:errors="*{nome}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="tipo" class="form-label campo-obrigatorio">Tipo</label>
                                        <select class="form-select" id="tipo" th:field="*{tipo}"
                                                th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                                            <option value="">Selecione…</option>
                                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">PRODUTO</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao" th:field="*{descricao}"
                                              rows="2" maxlength="300"></textarea>
                                    <div class="invalid-feedback" th:errors="*{descricao}"></div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label for="precoUnitario" class="form-label campo-obrigatorio">Preço unitário</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" step="0.01" min="0.01" class="form-control"
                                                   id="precoUnitario" th:field="*{precoUnitario}" placeholder="0,00"
                                                   th:classappend="${#fields.hasErrors('precoUnitario')} ? 'is-invalid'">
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{precoUnitario}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="estoqueAtual" class="form-label">Estoque atual</label>
                                        <input type="number" min="0" max="100000" class="form-control"
                                               id="estoqueAtual" th:field="*{estoqueAtual}"
                                               th:classappend="${#fields.hasErrors('estoqueAtual')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{estoqueAtual}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="estoqueMinimo" class="form-label">Estoque mínimo</label>
                                        <input type="number" min="0" max="100000" class="form-control"
                                               id="estoqueMinimo" th:field="*{estoqueMinimo}"
                                               th:classappend="${#fields.hasErrors('estoqueMinimo')} ? 'is-invalid'">
                                        <div class="form-text">Alerta de estoque baixo quando atual ≤ mínimo.</div>
                                        <div class="invalid-feedback" th:errors="*{estoqueMinimo}"></div>
                                    </div>
                                </div>

                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" role="switch" id="controlaEstoque"
                                           th:field="*{controlaEstoque}">
                                    <label class="form-check-label" for="controlaEstoque">Controla estoque (apenas produtos)</label>
                                </div>

                                <div class="form-check form-switch mb-4">
                                    <input class="form-check-input" type="checkbox" role="switch" id="ativo"
                                           th:field="*{ativo}">
                                    <label class="form-check-label" for="ativo">Item ativo (pode ser lançado em consumos)</label>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar
                                    </button>
                                    <a class="btn btn-outline-secondary" th:href="@{/itens}">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
        </main>
    </div>

</div>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
