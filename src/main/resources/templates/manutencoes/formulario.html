<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body data-area="admin">
<a th:replace="~{layout/fragments :: pular-para-conteudo}"></a>
<div class="app-wrapper">

    <aside th:replace="~{layout/fragments :: sidebar('manutencao')}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/fragments :: topbar}"></header>

        <main class="app-content" id="app-conteudo" tabindex="-1">
            <th:block th:fragment="conteudo">
            <div th:replace="~{layout/fragments :: mensagens}"></div>

            <div class="page-header">
    <div>
        <div class="page-context">Quartos & insumos</div>
        <h1 th:text="${titulo}">Nova ordem de manutenção</h1>
    </div>
    <div class="page-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/manutencoes}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Voltar
        </a>
    </div>
</div>

            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="alert alert-info py-2 small mb-3">
                                <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
                                Não é possível abrir manutenção para quarto com hospedagem em andamento ou
                                com outra ordem ativa. Prioridade CRÍTICA interdita o quarto imediatamente.
                            </div>

                            <form th:action="@{/manutencoes}" th:object="${form}" method="post" novalidate>
    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="quartoId" class="form-label campo-obrigatorio">Quarto</label>
                                        <select class="form-select" id="quartoId" th:field="*{quartoId}"
                                                th:classappend="${#fields.hasErrors('quartoId')} ? 'is-invalid'">
                                            <option value="">Selecione…</option>
                                            <option th:each="q : ${quartos}" th:value="${q.id}"
                                                    th:text="'Quarto ' + ${q.numero}">Quarto 101</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{quartoId}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="prioridade" class="form-label campo-obrigatorio">Prioridade</label>
                                        <select class="form-select" id="prioridade" th:field="*{prioridade}"
                                                th:classappend="${#fields.hasErrors('prioridade')} ? 'is-invalid'">
                                            <option value="">Selecione…</option>
                                            <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}">MEDIA</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{prioridade}"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="titulo" class="form-label campo-obrigatorio">Título</label>
                                    <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                                           maxlength="120" placeholder="Ex.: Ar condicionado vazando">
                                    <div class="invalid-feedback" th:errors="*{titulo}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao" th:field="*{descricao}"
                                              rows="3" maxlength="500"></textarea>
                                    <div class="invalid-feedback" th:errors="*{descricao}"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="observacoes" class="form-label">Observações</label>
                                    <textarea class="form-control" id="observacoes" th:field="*{observacoes}"
                                              rows="2" maxlength="300"></textarea>
                                    <div class="invalid-feedback" th:errors="*{observacoes}"></div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Abrir ordem
                                    </button>
                                    <a class="btn btn-outline-secondary" th:href="@{/manutencoes}">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
        </main>
    </div>

</div>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
