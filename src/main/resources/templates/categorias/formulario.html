<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body data-area="admin">
<a th:replace="~{layout/fragments :: pular-para-conteudo}"></a>
<div class="app-wrapper">

    <aside th:replace="~{layout/fragments :: sidebar('categorias')}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/fragments :: topbar}"></header>

        <main class="app-content" id="app-conteudo" tabindex="-1">
            <th:block th:fragment="conteudo">
            <div th:replace="~{layout/fragments :: mensagens}"></div>

            <div class="page-header">
    <div>
        <div class="page-context">Cadastros</div>
        <h1 th:text="${titulo}">Nova categoria</h1>
    </div>
    <div class="page-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/categorias}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Voltar
        </a>
    </div>
</div>

            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form th:action="${form.id == null} ? @{/categorias} : @{'/categorias/' + ${form.id}}"
                                  th:object="${form}" method="post" novalidate>
                                <div class="mb-3">
                                    <label for="nome" class="form-label campo-obrigatorio">Nome</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}"
                                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" maxlength="80"
                                           placeholder="Ex.: Standard, Luxo, Suíte">
                                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="2"
                                              maxlength="500"
                                              placeholder="Detalhes da acomodação (opcional)"></textarea>
                                    <div class="invalid-feedback" th:errors="*{descricao}"></div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label for="capacidadeMaxima" class="form-label campo-obrigatorio">Capacidade máxima</label>
                                        <div class="input-group">
                                            <input type="number" min="1" class="form-control" id="capacidadeMaxima"
                                                   th:field="*{capacidadeMaxima}"
                                                   th:classappend="${#fields.hasErrors('capacidadeMaxima')} ? 'is-invalid'">
                                            <span class="input-group-text">hóspede(s)</span>
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{capacidadeMaxima}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="quantidadeCamas" class="form-label campo-obrigatorio">Camas</label>
                                        <input type="number" min="1" class="form-control" id="quantidadeCamas"
                                               th:field="*{quantidadeCamas}"
                                               th:classappend="${#fields.hasErrors('quantidadeCamas')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{quantidadeCamas}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="precoBase" class="form-label campo-obrigatorio">Preço-base (R$/diária)</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" step="0.01" min="0.01" class="form-control" id="precoBase"
                                                   th:field="*{precoBase}"
                                                   th:classappend="${#fields.hasErrors('precoBase')} ? 'is-invalid'"
                                                   placeholder="0,00">
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{precoBase}"></div>
                                    </div>
                                </div>

                                <div class="form-check form-switch mb-4">
                                    <input class="form-check-input" type="checkbox" role="switch" id="ativo"
                                           th:field="*{ativo}">
                                    <label class="form-check-label" for="ativo">Categoria ativa (disponível para novos quartos)</label>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar
                                    </button>
                                    <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
        </main>
    </div>

</div>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
