<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · HotelImpact'">HotelImpact</title>
    <meta name="description" content="HotelImpact — sistema de gestão hoteleira (PMS) desenvolvido em Java com Spring Boot.">
    <script>
        (function () {
            var temaSalvo = localStorage.getItem('hi-tema');
            var prefereEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', temaSalvo || (prefereEscuro ? 'dark' : 'light'));
        })();
    </script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/inter.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/icons/favicon.ico}">
</head>
<body>

<!-- Navegação pública -->
<header th:fragment="navbar(ativo)" class="site-nav">
    <nav class="container d-flex align-items-center justify-content-between py-3" aria-label="Navegação do site">
        <a class="site-brand" th:href="@{/}">
            <img th:src="@{/images/hotelimpact-logo.png}" alt="HotelImpact" class="site-logo site-logo-completa" width="500" height="200">
            <img th:src="@{/images/hotelimpact-logo-simbolo.png}" alt="" class="site-logo-simbolo" width="153" height="160">
            <span class="site-brand-nome">HotelImpact</span>
        </a>
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <a class="site-nav-link d-none d-sm-inline" th:href="@{/}" th:classappend="${ativo} == 'inicio' ? 'active' : ''">Início</a>
            <a class="site-nav-link d-none d-md-inline" th:href="@{/funcionalidades}" th:classappend="${ativo} == 'funcionalidades' ? 'active' : ''">Funcionalidades</a>
            <a class="site-nav-link d-none d-md-inline" th:href="@{/sobre}" th:classappend="${ativo} == 'sobre' ? 'active' : ''">Sobre</a>
            <button type="button" id="botaoTema" class="btn btn-sm btn-tema"
                    aria-pressed="false" title="Ativar modo escuro">
                <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
            </button>
            <a class="btn btn-primary btn-sm" th:href="@{/login}">Entrar no sistema</a>
        </div>
    </nav>
</header>

<!-- Rodapé público -->
<footer th:fragment="footer" class="site-footer">
    <div class="container py-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-2 text-secondary">
            <img th:src="@{/images/hotelimpact-logo-simbolo.png}" alt="" class="footer-simbolo" width="153" height="160">
            <span>HotelImpact · Sistema de gestão hoteleira</span>
        </div>
        <nav class="d-flex gap-3" aria-label="Links do rodapé">
            <a class="site-nav-link" th:href="@{/funcionalidades}">Funcionalidades</a>
            <a class="site-nav-link" th:href="@{/sobre}">Sobre</a>
            <a class="site-nav-link" th:href="@{/login}">Entrar</a>
        </nav>
    </div>
</footer>

<div th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

        <rect x="76" y="196" width="14" height="18" rx="1.5" fill="#f59e0b"/>
        <rect x="100" y="196" width="14" height="18" rx="1.5" fill="#d97706"/>
    </g>
    <!-- prédio lateral direito -->
    <rect x="280" y="132" width="80" height="168" fill="#131c2b" stroke="#273349" stroke-width="2"/>

    <rect x="0" y="294" width="420" height="6" fill="#0e1524"/>
</svg>
