spring:
  application:
    name: hotel_impact

  server:
    port: ${PORT:8080}

  datasource:
    url: ${SPRING_DATASOURCE_URL:DB_URL_PLACEHOLDER}
    username: ${SPRING_DATASOURCE_USERNAME:DB_CREDENTIAL_PLACEHOLDER}
    password: ${SPRING_DATASOURCE_PASSWORD:DB_CREDENTIAL_PLACEHOLDER}
    driver-class-name: org.DB_CREDENTIAL_PLACEHOLDERql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-DB_CREDENTIAL_PLACEHOLDER.sql

  thymeleaf:
    cache: false

  security:
    user:
      name: ${HOTELIMPACT_USER:RECEPCIONISTA_USER_PLACEHOLDER}
      password: ${HOTELIMPACT_PASSWORD:RECEPCIONISTA_PASSWORD_PLACEHOLDER}
      roles: RECEPCAO

app:
  seed-demo: ${APP_SEED_DEMO:false}

logging:
  level:
    com.gabrielflorencco.hotel_impact: INFO
    org.springframework.jdbc.core.JdbcTemplate: DEBUG