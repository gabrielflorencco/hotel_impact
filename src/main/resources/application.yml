spring:
  application:
    name: hotel_impact

  server:
    port: ${PORT:8080}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
      data-locations: classpath:data-postgres.sql

  thymeleaf:
    cache: false

  security:
    user:
      name: ${HOTELIMPACT_USER}
      password: ${HOTELIMPACT_PASSWORD}
      roles: RECEPCAO

app:
  seed-demo: ${APP_SEED_DEMO:false}

logging:
  level:
    com.gabrielflorencco.hotel_impact: INFO
    org.springframework.jdbc.core.JdbcTemplate: DEBUG